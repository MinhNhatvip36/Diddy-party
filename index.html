      Mình là Bo, biệt danh nghe đơn giản nhưng đúng chất của mình: thoải mái, vui vẻ và hơi… lười một chút.
      Mình có một sở thích khá đặc biệt: rất thích anh da đen Aston Hall — một người mà mình cực kỳ ngưỡng mộ 
      vì cá tính mạnh mẽ, phong thái tự tin và năng lượng tích cực mà anh ấy mang lại. Ngoài ra, mình còn mê nghe nhạc,
      chơi game và đặc biệt là giỏi mấy khoản “tám chuyện” với bạn bè.
      Sở trường của mình là sáng tạo linh tinh, nghĩ ra những ý tưởng bất chợt và luôn làm mọi thứ theo cách độc lạ của riêng mình.
      Rất vui được làm quen và hy vọng mọi người sẽ nhớ đến một Bo vui tính và đầy năng lượng!
